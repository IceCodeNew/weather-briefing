[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "weather-briefing"
version = "5.0.1-dev"
description = "Stateful, source-cited weather briefings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "any-llm-sdk>=1.19,<2",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "cryptography>=50,<51",
  "feedparser>=6.0.11,<7",
  "httpx[socks]>=0.27,<1",
  "pendulum>=3.1,<4",
  "pydantic>=2.12,<3",
  "PyJWT>=2.10,<3",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
docker = [
  "any-llm-sdk[deepseek,openai,openrouter]>=1.19,<2",
]
dev = [
  "any-llm-sdk[deepseek,openai,openrouter,otari]>=1.19,<2",
  "anyio>=4.11,<5",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
weather-briefing = "weather_briefing.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[tool.uv]
required-version = ">=0.11.28,<1"

[tool.uv.build-backend]
module-root = ""

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The project has no copyright-header policy.
  "CPY001",
  # These docstring and whitespace rules conflict with Ruff's formatter.
  "W191",
  "E111",
  "E114",
  "E117",
  "D203",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "COM812",
  "COM819",
]
preview = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # pytest is built on `assert`; flagging every assertion adds no signal.
  "S101",
  # Test functions, helpers, and fixtures do not need docstrings.
  "D100",
  "D101",
  "D102",
  "D103",
  "D107",
  # Test functions and helpers do not benefit from annotating every parameter,
  # return type, *args, or **kwargs — fixture types are defined by pytest.
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN202",
  "ANN204",
  "ANN401",
  # Test doubles, mock classes, and transport lambdas must match the interface
  # being faked even when they do not use every parameter.
  "ARG001",
  "ARG002",
  "ARG005",
  # Tests assertions and fixtures routinely compare against literal values.
  "PLR2004",
  # CJK punctuation in test data is intentional.
  "RUF001",
  # Tests need to access private members to verify internal state.
  "SLF001",
  # Function-level imports are used for cache clearing, mock isolation, and
  # lazy side-effect control.
  "PLC0415",
  # Test helpers and doubles accept simple positional booleans.
  "FBT001",
  "FBT002",
  "FBT003",
]
